<script>
(function(){
  var S='mx-azc-k',f=document.getElementById('f'),k=document.getElementById('k'),e=document.getElementById('e');
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function open(pw,auto){
    var raw=b64(document.getElementById('d').textContent.trim()),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
      .then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt'])})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct)})
      .then(function(pt){try{sessionStorage.setItem(S,pw)}catch(x){}var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()})
      .catch(function(){try{sessionStorage.removeItem(S)}catch(x){}if(!auto){e.textContent='Mot de passe incorrect. Vérifiez et réessayez.';k.select()}});
  }
  f.addEventListener('submit',function(ev){ev.preventDefault();e.textContent='';open(k.value,false)});
  var hk=(location.hash.match(/[#&]k=([^&]+)/)||[])[1];
  if(hk){history.replaceState(null,'',location.pathname+location.search);open(decodeURIComponent(hk),true);return}
  try{var s=sessionStorage.getItem(S);if(s)open(s,true)}catch(x){}
})();
